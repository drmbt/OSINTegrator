services:
  postgres:
    image: postgres:16-alpine
    container_name: osintegrator-postgres
    environment:
      POSTGRES_DB: osintegrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  memgraph:
    image: memgraph/memgraph:2.18.1
    container_name: osintegrator-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph-data:/var/lib/memgraph

  redis:
    image: redis:7-alpine
    container_name: osintegrator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  memgraph-data:
  redis-data:
